<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - ScoutConnect</title>
  <link rel="stylesheet" href="CSS/chat.css">
</head>
<body>
  <!-- Header del Chat -->
  <header class="chat-header">
    <div class="chat-header-content">
      <div class="header-left">
        <a href="dashboard-futbolista.html" class="back-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="15,18 9,12 15,6"></polyline>
          </svg>
        </a>
        <div class="header-info">
          <img src="imagenes/imagen1.png" alt="Avatar" class="user-avatar">
          <div class="user-info">
            <h2>Mensajes</h2>
            <span class="user-status">Juan Pérez</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="searchBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
        <button class="action-btn" id="moreBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="19" cy="12" r="1"></circle>
            <circle cx="5" cy="12" r="1"></circle>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal del Chat -->
  <main class="chat-main">
    <!-- Sidebar de Conversaciones -->
    <aside class="conversations-sidebar">
      <div class="conversations-header">
        <div class="conversations-title">
          <h3>Conversaciones</h3>
          <span class="conversations-count" id="conversationsCount">4</span>
        </div>
        <button class="new-conversation-btn" id="newConversationBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 5v14m-7-7h14"></path>
          </svg>
        </button>
      </div>
      
      <!-- Lista de Conversaciones -->
      <div class="conversations-list" id="conversationsList">
        <!-- Las conversaciones se cargarán dinámicamente -->
      </div>
    </aside>

    <!-- Área Principal del Chat -->
    <section class="chat-area">
      <!-- Estado inicial: No hay chat seleccionado -->
      <div class="no-chat-state" id="noChatState">
        <div class="no-chat-content">
          <div class="no-chat-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <h3>Selecciona una conversación</h3>
          <p>Elige una conversación del panel izquierdo para comenzar a chatear</p>
        </div>
      </div>

      <!-- Chat Activo -->
      <div class="active-chat" id="activeChat" style="display: none;">
        <!-- Header del Chat Activo -->
        <div class="active-chat-header">
          <div class="chat-contact-info">
            <img src="" alt="Avatar" class="contact-avatar" id="contactAvatar">
            <div class="contact-details">
              <h4 id="contactName">Nombre del Contacto</h4>
              <span class="contact-status" id="contactStatus">En línea</span>
            </div>
          </div>
          <div class="chat-actions">
            <button class="chat-action-btn" id="videoCallBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
            </button>
            <button class="chat-action-btn" id="phoneCallBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
              </svg>
            </button>
            <button class="chat-action-btn" id="infoBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Mensajes del Chat -->
        <div class="messages-area" id="messagesArea">
          <!-- Indicador de mensajes nuevos -->
          <div class="new-messages-indicator" id="newMessagesIndicator">
            <span>Nuevos mensajes</span>
            <span>↓</span>
          </div>
          <!-- Los mensajes se cargarán dinámicamente -->
        </div>

        <!-- Input del Chat -->
        <div class="chat-input-area">
          <div class="chat-input-container">
            <button class="attachment-btn" id="attachmentBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.49"></path>
              </svg>
            </button>
            <div class="message-input-wrapper">
              <textarea id="messageInput" placeholder="Escribe tu mensaje..." autocomplete="off" rows="1"></textarea>
              <span class="char-counter" id="charCounter">0/500</span>
              <button class="emoji-btn" id="emojiBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                  <line x1="9" y1="9" x2="9.01" y2="9"></line>
                  <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
              </button>
            </div>
            <button class="send-btn" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Botón para ir al final del chat -->
  <button class="scroll-to-bottom" id="scrollToBottom">
    ↓
  </button>

  <!-- Indicador de escritura -->
  <div class="typing-indicator" id="typingIndicator">
    <span>Escribiendo</span>
    <div class="typing-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- JavaScript del Chat -->
  <script src="JS/chat.js"></script>
</body>
</html>
