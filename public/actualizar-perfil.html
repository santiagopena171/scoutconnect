<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Perfil en Supabase</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #2c3e50;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
      width: 100%;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status.loading {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      color: #856404;
    }
    .status.success {
      background: #d4edda;
      border-left: 4px solid #28a745;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      color: #721c24;
    }
    .status.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Actualizar Perfil de Jugador</h1>
    <p style="color: #7f8c8d; margin-bottom: 30px;">
      Completa tu información para que aparezca correctamente en las búsquedas
    </p>

    <div id="statusMessage" class="status hidden"></div>

    <form id="updateProfileForm">
      <div class="form-group">
        <label for="height">Altura (cm) *</label>
        <input type="number" id="height" placeholder="175" min="140" max="220" required>
      </div>

      <div class="form-group">
        <label for="weight">Peso (kg) *</label>
        <input type="number" id="weight" placeholder="70" min="40" max="120" required>
      </div>

      <div class="form-group">
        <label for="club">Club Actual *</label>
        <input type="text" id="club" placeholder="Ej: River Plate" required>
      </div>

      <div class="form-group">
        <label for="league">Liga *</label>
        <input type="text" id="league" placeholder="Ej: Primera División Argentina" required>
      </div>

      <div class="form-group">
        <label for="secondaryPosition">Posición Secundaria (opcional)</label>
        <select id="secondaryPosition">
          <option value="">Seleccionar...</option>
          <option value="Portero">Portero</option>
          <option value="Defensa Central">Defensa Central</option>
          <option value="Lateral Derecho">Lateral Derecho</option>
          <option value="Lateral Izquierdo">Lateral Izquierdo</option>
          <option value="Mediocampista Defensivo">Mediocampista Defensivo</option>
          <option value="Mediocampista Central">Mediocampista Central</option>
          <option value="Mediocampista Ofensivo">Mediocampista Ofensivo</option>
          <option value="Extremo Derecho">Extremo Derecho</option>
          <option value="Extremo Izquierdo">Extremo Izquierdo</option>
          <option value="Delantero Centro">Delantero Centro</option>
          <option value="Segundo Delantero">Segundo Delantero</option>
        </select>
      </div>

      <div class="form-group">
        <label for="contractStatus">Estado Contractual</label>
        <select id="contractStatus">
          <option value="amateur">Amateur</option>
          <option value="semiprofessional">Semi-profesional</option>
          <option value="professional">Profesional</option>
          <option value="free-agent">Agente libre</option>
          <option value="youth">Juvenil</option>
        </select>
      </div>

      <div class="form-group">
        <label for="marketValue">Valor de Mercado (opcional)</label>
        <input type="text" id="marketValue" placeholder="Ej: 500K, 1.5M">
        <small style="color: #7f8c8d;">Formato: 500K para miles, 1.5M para millones</small>
      </div>

      <div class="form-group">
        <label for="bio">Biografía (opcional)</label>
        <textarea id="bio" rows="4" placeholder="Describe tu estilo de juego, experiencia, fortalezas..."></textarea>
      </div>

      <button type="submit" id="submitBtn">
        💾 Actualizar Perfil en Supabase
      </button>
    </form>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../src/JS/supabase-config.js"></script>
  <script>
    const form = document.getElementById('updateProfileForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    // Cargar datos existentes del perfil
    window.addEventListener('DOMContentLoaded', async () => {
      await loadCurrentProfile();
    });

    async function loadCurrentProfile() {
      try {
        const { data: { user }, error: authError } = await supabase.auth.getUser();
        
        if (authError || !user) {
          showStatus('error', 'Debes iniciar sesión primero');
          submitBtn.disabled = true;
          return;
        }

        const { data: profile, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .single();

        if (!error && profile) {
          // Prellenar formulario con datos existentes
          if (profile.height) document.getElementById('height').value = profile.height;
          if (profile.weight) document.getElementById('weight').value = profile.weight;
          if (profile.current_club) document.getElementById('club').value = profile.current_club;
          if (profile.league) document.getElementById('league').value = profile.league;
          if (profile.secondary_position) document.getElementById('secondaryPosition').value = profile.secondary_position;
          if (profile.contract_status) document.getElementById('contractStatus').value = profile.contract_status;
          if (profile.market_value) document.getElementById('marketValue').value = profile.market_value;
          if (profile.bio) document.getElementById('bio').value = profile.bio;
          
          showStatus('success', `Perfil cargado: ${profile.first_name} ${profile.last_name}`);
        }
      } catch (error) {
        console.error('Error:', error);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      showStatus('loading', 'Actualizando perfil...');

      try {
        const { data: { user }, error: authError } = await supabase.auth.getUser();
        
        if (authError || !user) {
          showStatus('error', 'Error: No hay sesión activa');
          submitBtn.disabled = false;
          return;
        }

        const updateData = {
          height: parseFloat(document.getElementById('height').value),
          weight: parseFloat(document.getElementById('weight').value),
          current_club: document.getElementById('club').value,
          league: document.getElementById('league').value,
          secondary_position: document.getElementById('secondaryPosition').value || null,
          contract_status: document.getElementById('contractStatus').value,
          market_value: document.getElementById('marketValue').value || null,
          bio: document.getElementById('bio').value || null,
          updated_at: new Date().toISOString()
        };

        const { error: updateError } = await supabase
          .from('profiles')
          .update(updateData)
          .eq('id', user.id);

        if (updateError) {
          throw updateError;
        }

        showStatus('success', '✅ ¡Perfil actualizado correctamente! Ahora los scouts podrán ver toda tu información.');
        
        setTimeout(() => {
          window.location.href = 'dashboard-futbolista.html';
        }, 2000);

      } catch (error) {
        console.error('Error:', error);
        showStatus('error', `Error: ${error.message}`);
        submitBtn.disabled = false;
      }
    });

    function showStatus(type, message) {
      statusMessage.className = `status ${type}`;
      statusMessage.textContent = message;
    }
  </script>
</body>
</html>
